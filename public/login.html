<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Intelligent Career Guidance Web Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <span class="navbar-brand-icon"><i class="bi bi-compass"></i></span>
        <span>ICGWB</span>
      </a>
      <a href="/index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Portal
      </a>
    </div>
  </nav>

  <!-- Login Card -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            
            <div class="text-center mb-4">
              <div class="navbar-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-person-lock"></i>
              </div>
              <h3 class="fw-bold mb-1">Welcome Back</h3>
              <p class="text-muted small">Sign in to your Student or Administrator account</p>
            </div>

            <!-- Demo Fill Buttons for Fast Evaluation -->
            <div class="p-3 bg-light rounded-3 mb-4 border">
              <div class="small fw-semibold text-secondary mb-2 text-center"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins:</div>
              <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="fillDemo('student')">
                  Student Account
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="fillDemo('admin')">
                  Admin Account
                </button>
              </div>
            </div>

            <form id="login-form">
              <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control border-start-0 py-2" placeholder="name@example.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                  <input type="password" id="password" class="form-control border-start-0 py-2" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2.5 rounded-pill fw-semibold shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
              </button>

              <div class="text-center small text-muted">
                Don't have an account yet? 
                <a href="/register.html" class="text-primary fw-semibold text-decoration-none">Register as Student</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small text-secondary mt-auto border-top bg-white">
    &copy; 2026 Intelligent Career Guidance Web Portal (ICGWB)
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    function fillDemo(type) {
      if (type === 'admin') {
        document.getElementById('email').value = 'admin@icgwb.edu';
        document.getElementById('password').value = 'admin123';
        showToast('Admin credentials filled!', 'info');
      } else {
        document.getElementById('email').value = 'student@example.com';
        document.getElementById('password').value = 'student123';
        showToast('Student credentials filled!', 'info');
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';

      const res = await API.post('/api/auth/login', { email, password });

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';

      if (res.success) {
        showToast(res.message, 'success');
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (res.user && res.user.role === 'admin') {
            window.location.href = redirect || '/admin.html';
          } else {
            window.location.href = redirect || '/index.html';
          }
        }, 800);
      } else {
        showToast(res.message || 'Login failed. Please check your credentials.', 'danger');
      }
    });
  </script>
</body>
</html>
