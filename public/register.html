<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Intelligent Career Guidance Web Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="/index.html">
        <span class="navbar-brand-icon"><i class="bi bi-compass"></i></span>
        <span>ICGWB</span>
      </a>
      <a href="/index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Portal
      </a>
    </div>
  </nav>

  <!-- Register Card -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            
            <div class="text-center mb-4">
              <div class="navbar-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-person-badge"></i>
              </div>
              <h3 class="fw-bold mb-1">Create Student Account</h3>
              <p class="text-muted small">Register to save bookmarks and contact educational advisors</p>
            </div>

            <form id="register-form">
              <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                  <input type="text" id="name" class="form-control border-start-0 py-2" placeholder="e.g. Priya Nair" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control border-start-0 py-2" placeholder="priya@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Password (min 6 characters)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-lock"></i></span>
                  <input type="password" id="password" class="form-control border-start-0 py-2" placeholder="••••••••" minlength="6" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-check2-circle"></i></span>
                  <input type="password" id="confirm_password" class="form-control border-start-0 py-2" placeholder="••••••••" minlength="6" required>
                </div>
              </div>

              <button type="submit" id="btn-register" class="btn btn-primary w-100 py-2.5 rounded-pill fw-semibold shadow-sm mb-3">
                <i class="bi bi-person-check me-1"></i> Register Account
              </button>

              <div class="text-center small text-muted">
                Already registered? 
                <a href="/login.html" class="text-primary fw-semibold text-decoration-none">Sign In Here</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small text-secondary mt-auto border-top bg-white">
    &copy; 2026 Intelligent Career Guidance Web Portal (ICGWB)
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;
      const btn = document.getElementById('btn-register');

      if (password !== confirm_password) {
        showToast('Passwords do not match. Please re-enter.', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating account...';

      const res = await API.post('/api/auth/register', { name, email, password });

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-check me-1"></i> Register Account';

      if (res.success) {
        showToast(res.message, 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 900);
      } else {
        showToast(res.message || 'Registration failed.', 'danger');
      }
    });
  </script>
</body>
</html>
