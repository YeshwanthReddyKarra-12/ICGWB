<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="defBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#defBg)"/>

  <!-- Fighter Jet Silhouette -->
  <g transform="translate(350, 180) scale(1.1)">
    <!-- Wings & Body -->
    <path d="M 0 -80 L 15 -10 L 95 30 L 95 45 L 20 30 L 20 65 L 45 80 L 45 90 L -45 90 L -45 80 L -20 65 L -20 30 L -95 45 L -95 30 L -15 -10 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Canopy -->
    <ellipse cx="0" cy="-25" rx="7" ry="25" fill="#38bdf8"/>
    <!-- Exhaust Fire / Thrust -->
    <polygon points="-12,90 0,125 12,90" fill="#f97316"/>
    <polygon points="-6,90 0,110 6,90" fill="#fde047"/>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="230" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="115" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 ARMED FORCES • UPSC NDA</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Officer Rank + Military Pay</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">DEFENCE SERVICES (ARMY / NAVY / AIR FORCE)</text>
  <text x="350" y="380" fill="#cbd5e1" font-size="13" font-family="sans-serif" text-anchor="middle">UPSC NDA &amp; NA • 5-Day SSB Interview • NDA Khadakwasla, Pune</text>
</svg>
