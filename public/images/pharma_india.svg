<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="phaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#phaBg)"/>

  <!-- Molecular Ring & Flask -->
  <g transform="translate(350, 180) scale(1.1)">
    <!-- Chemistry Flask -->
    <path d="M -15 -70 L 15 -70 L 15 -30 L 60 55 C 70 75, 55 90, 35 90 L -35 90 C -55 90, -70 75, -60 55 L -15 -30 Z" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.3))"/>
    <path d="M -45 55 L 45 55 C 55 75, 45 85, 30 85 L -30 85 C -45 85, -55 75, -45 55 Z" fill="#2dd4bf"/>
    <!-- Bubbles -->
    <circle cx="-10" cy="40" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="15" cy="20" r="7" fill="#ffffff" opacity="0.7"/>
    <circle cx="5" cy="5" r="4" fill="#ffffff" opacity="0.7"/>
    <!-- Capsule / Pill -->
    <g transform="translate(90, -20) rotate(45)">
      <rect x="-14" y="-30" width="28" height="30" rx="14" fill="#f43f5e"/>
      <rect x="-14" y="0" width="28" height="30" rx="14" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="230" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="115" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 PHARMACY OF THE WORLD • PCI</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#0d9488" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">₹4 LPA - ₹16 LPA</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">PHARMACIST &amp; FORMULATION SCIENTIST</text>
  <text x="350" y="380" fill="#ccfbf1" font-size="13" font-family="sans-serif" text-anchor="middle">4-Year B.Pharm • NIPER / Jamia Hamdard • Generic Drug R&amp;D</text>
</svg>
