<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#dsBg)"/>

  <!-- Neural Net Nodes & Connectivity -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <!-- Layer 1 to 2 -->
    <line x1="200" y1="120" x2="350" y2="100"/>
    <line x1="200" y1="120" x2="350" y2="180"/>
    <line x1="200" y1="200" x2="350" y2="100"/>
    <line x1="200" y1="200" x2="350" y2="180"/>
    <line x1="200" y1="200" x2="350" y2="260"/>
    <line x1="200" y1="280" x2="350" y2="180"/>
    <line x1="200" y1="280" x2="350" y2="260"/>
    <!-- Layer 2 to 3 -->
    <line x1="350" y1="100" x2="500" y2="150"/>
    <line x1="350" y1="180" x2="500" y2="150"/>
    <line x1="350" y1="180" x2="500" y2="230"/>
    <line x1="350" y1="260" x2="500" y2="230"/>
  </g>

  <!-- Nodes -->
  <circle cx="200" cy="120" r="16" fill="#38bdf8"/>
  <circle cx="200" cy="200" r="16" fill="#38bdf8"/>
  <circle cx="200" cy="280" r="16" fill="#38bdf8"/>

  <circle cx="350" cy="100" r="18" fill="#4ade80"/>
  <circle cx="350" cy="180" r="22" fill="#facc15"/>
  <text x="350" y="186" fill="#0f172a" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">AI</text>
  <circle cx="350" cy="260" r="18" fill="#4ade80"/>

  <circle cx="500" cy="150" r="16" fill="#fb923c"/>
  <circle cx="500" cy="230" r="16" fill="#fb923c"/>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="105" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 DATA &amp; AI • INDIA STACK</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#0f766e" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">₹8 LPA - ₹40 LPA</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">DATA SCIENTIST &amp; ML SPECIALIST</text>
  <text x="350" y="380" fill="#ccfbf1" font-size="13" font-family="sans-serif" text-anchor="middle">B.Tech AI &amp; DS • B.Stat ISI Kolkata • Predictive Systems &amp; LLMs</text>
</svg>
