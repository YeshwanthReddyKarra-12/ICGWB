<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="desBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="50%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#desBg)"/>

  <!-- Mobile Screen Mockups -->
  <g transform="translate(350, 180)">
    <!-- Back Screen -->
    <rect x="-90" y="-80" width="90" height="150" rx="12" fill="#18181b" stroke="#a1a1aa" stroke-width="2" transform="rotate(-12)"/>
    <!-- Front Screen -->
    <rect x="-20" y="-70" width="100" height="165" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.3))"/>
    <circle cx="30" cy="-55" r="3" fill="#a1a1aa"/>
    <rect x="-5" y="-40" width="70" height="14" rx="4" fill="#f43f5e"/>
    <rect x="-5" y="-18" width="50" height="8" rx="2" fill="#e4e4e7"/>
    <rect x="-5" y="-5" width="70" height="40" rx="6" fill="#fdf2f8"/>
    <!-- Interactive Button -->
    <rect x="-5" y="45" width="70" height="18" rx="9" fill="#0284c7"/>
    <text x="30" y="58" fill="#ffffff" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">Book UPI</text>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="105" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 NID DAT • UCEED IIT</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#a21caf" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">₹6 LPA - ₹28 LPA</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">UI/UX &amp; PRODUCT DESIGNER</text>
  <text x="350" y="380" fill="#f5d0fe" font-size="13" font-family="sans-serif" text-anchor="middle">NID Ahmedabad • IDC IIT Bombay • Design Systems &amp; Mobile Interfaces</text>
</svg>
