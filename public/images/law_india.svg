<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#lawBg)"/>

  <!-- Pillars of Justice & Balance Scale -->
  <g transform="translate(350, 180) scale(1.15)">
    <!-- Base & Beam -->
    <rect x="-8" y="-70" width="16" height="135" fill="#facc15" rx="3"/>
    <rect x="-40" y="60" width="80" height="14" fill="#ca8a04" rx="4"/>
    <line x1="-80" y1="-55" x2="80" y2="-55" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left Pan -->
    <line x1="-75" y1="-55" x2="-95" y2="-10" stroke="#fef08a" stroke-width="2"/>
    <line x1="-75" y1="-55" x2="-55" y2="-10" stroke="#fef08a" stroke-width="2"/>
    <path d="M -105 -10 Q -75 10 -45 -10 Z" fill="#facc15"/>

    <!-- Right Pan -->
    <line x1="75" y1="-55" x2="55" y2="-10" stroke="#fef08a" stroke-width="2"/>
    <line x1="75" y1="-55" x2="95" y2="-10" stroke="#fef08a" stroke-width="2"/>
    <path d="M 45 -10 Q 75 10 105 -10 Z" fill="#facc15"/>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="105" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 CLAT / AILET • NLUs</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#7e22ce" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">₹7 LPA - ₹25 LPA</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">CORPORATE ADVOCATE &amp; LEGAL COUNSEL</text>
  <text x="350" y="380" fill="#f3e8ff" font-size="13" font-family="sans-serif" text-anchor="middle">5-Year Integrated B.A. LL.B • NLSIU / NALSAR • High Court &amp; Corporate</text>
</svg>
