<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#spaceBg)"/>

  <!-- Stars -->
  <circle cx="100" cy="80" r="2" fill="#ffffff"/>
  <circle cx="250" cy="50" r="1.5" fill="#ffffff"/>
  <circle cx="480" cy="90" r="2" fill="#ffffff"/>
  <circle cx="620" cy="60" r="1.5" fill="#ffffff"/>

  <!-- ISRO LVM3 Rocket Ascent -->
  <g transform="translate(350, 180)">
    <!-- Exhaust Plume Flames -->
    <polygon points="-25,80 0,165 25,80" fill="#f97316" opacity="0.9"/>
    <polygon points="-14,80 0,140 14,80" fill="#fde047"/>
    <polygon points="-6,80 0,110 6,80" fill="#ffffff"/>

    <!-- Rocket Core Body -->
    <rect x="-18" y="-70" width="36" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Nose Cone -->
    <path d="M -18 -70 Q 0 -115 18 -70 Z" fill="#ea580c"/>
    <!-- Tricolor Flag on Rocket -->
    <rect x="-12" y="-35" width="24" height="4" fill="#ea580c"/>
    <rect x="-12" y="-31" width="24" height="4" fill="#ffffff"/>
    <rect x="-12" y="-27" width="24" height="4" fill="#16a34a"/>
    <text x="0" y="-12" fill="#1e3a8a" font-size="7" font-weight="900" font-family="sans-serif" text-anchor="middle">ISRO</text>

    <!-- Side Boosters S200 -->
    <rect x="-38" y="-30" width="16" height="105" rx="3" fill="#e2e8f0"/>
    <path d="M -38 -30 Q -30 -50 -22 -30 Z" fill="#ea580c"/>
    <polygon points="-36,75 -30,105 -24,75" fill="#f97316"/>

    <rect x="22" y="-30" width="16" height="105" rx="3" fill="#e2e8f0"/>
    <path d="M 22 -30 Q 30 -50 38 -30 Z" fill="#ea580c"/>
    <polygon points="24,75 30,105 36,75" fill="#f97316"/>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="230" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="115" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 ISRO / DRDO • IIST ALUMNI</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#ea580c" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">₹8 LPA - ₹22 LPA</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">AEROSPACE ENGINEER &amp; SPACE SCIENTIST</text>
  <text x="350" y="380" fill="#fed7aa" font-size="13" font-family="sans-serif" text-anchor="middle">JEE Advanced • IIST Thiruvananthapuram • ISRO Propulsion &amp; Satellites</text>
</svg>
