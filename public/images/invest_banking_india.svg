<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ibBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#ibBg)"/>

  <!-- Bullish Financial Stock Chart -->
  <path d="M 120 280 L 220 240 L 300 260 L 400 170 L 480 200 L 580 110" fill="none" stroke="#22c55e" stroke-width="4"/>
  <!-- Fill under chart -->
  <path d="M 120 280 L 220 240 L 300 260 L 400 170 L 480 200 L 580 110 L 580 300 L 120 300 Z" fill="rgba(34, 197, 94, 0.12)"/>

  <!-- Candlesticks -->
  <rect x="215" y="225" width="10" height="30" fill="#22c55e"/>
  <rect x="295" y="245" width="10" height="25" fill="#ef4444"/>
  <rect x="395" y="155" width="10" height="35" fill="#22c55e"/>
  <rect x="475" y="185" width="10" height="30" fill="#ef4444"/>
  <rect x="575" y="95" width="10" height="35" fill="#22c55e"/>

  <!-- Dalal Street / Indian Rupee Badge Circle -->
  <circle cx="350" cy="180" r="45" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))"/>
  <text x="350" y="196" fill="#15803d" font-size="42" font-weight="900" font-family="sans-serif" text-anchor="middle">₹</text>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="230" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="115" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 DALAL STREET • IIM / CAT</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#15803d" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">₹12 LPA - ₹50 LPA</text>
  </g>

  <text x="350" y="355" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">INVESTMENT BANKER &amp; FINANCIAL ANALYST</text>
  <text x="350" y="380" fill="#86efac" font-size="13" font-family="sans-serif" text-anchor="middle">IIM A/B/C • SRCC Delhi • BSE / NSE IPOs • M&amp;A Valuation</text>
</svg>
