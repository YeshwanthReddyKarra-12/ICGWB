<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <defs>
    <linearGradient id="iasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="700" height="400" fill="url(#iasBg)"/>

  <!-- Indian Tricolor Ribbon Arch -->
  <path d="M 0 320 Q 350 260 700 320" fill="none" stroke="#ea580c" stroke-width="10"/>
  <path d="M 0 330 Q 350 270 700 330" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M 0 340 Q 350 280 700 340" fill="none" stroke="#16a34a" stroke-width="10"/>

  <!-- Central Emblem / Pillar of Ashoka Capital -->
  <g transform="translate(350, 175)">
    <!-- Ashoka Chakra -->
    <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="#1e3a8a"/>
    <!-- 24 Spokes (simplified 12 spokes for crisp rendering) -->
    <g stroke="#1e3a8a" stroke-width="2.5">
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <line x1="-56" y1="0" x2="56" y2="0"/>
      <line x1="-39" y1="-39" x2="39" y2="39"/>
      <line x1="39" y1="-39" x2="-39" y2="39"/>
      <line x1="-52" y1="-21" x2="52" y2="21"/>
      <line x1="-21" y1="-52" x2="21" y2="52"/>
      <line x1="52" y1="-21" x2="-52" y2="21"/>
      <line x1="21" y1="-52" x2="-21" y2="52"/>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="210" height="32" rx="16" fill="rgba(234, 88, 12, 0.95)"/>
    <text x="105" y="21" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">🇮🇳 UPSC CIVIL SERVICES</text>
  </g>

  <g transform="translate(470, 40)">
    <rect width="190" height="32" rx="16" fill="rgba(255, 255, 255, 0.92)"/>
    <text x="95" y="21" fill="#1e3a8a" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">7th CPC Level 10 Pay</text>
  </g>

  <text x="350" y="360" fill="#ffffff" font-size="22" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1">CIVIL SERVICES OFFICER (IAS / IPS / IFS)</text>
  <text x="350" y="382" fill="#fed7aa" font-size="13" font-family="sans-serif" text-anchor="middle">UPSC CSE • District Collector / SP • Governance &amp; Administration</text>
</svg>
